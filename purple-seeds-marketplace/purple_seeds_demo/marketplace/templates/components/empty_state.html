<div class="card p-10 text-center flex flex-col gap-4">
  <p class="text-lg font-display">{{ title }}</p>
  <p class="text-sm text-[color:var(--ps-muted)]">{{ description }}</p>
  {% if cta_url and cta_label %}
    <a class="btn-primary px-5 py-3 rounded-full self-center" href="{{ cta_url }}">{{ cta_label }}</a>
  {% endif %}
</div>
