<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title description">
  <title id="title">CareSignal — conceptual case illustration</title>
  <desc id="description">An abstract confirmation and human review boundary with synthetic information. Conceptual illustration, not an application screenshot.</desc>
